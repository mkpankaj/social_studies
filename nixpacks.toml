providers = ["python", "node"]

[variables]
NODE_VERSION = "22"

[phases.install]
cmds = [
  "pip install -r backend/requirements.txt",
  "npm --prefix frontend install"
]

[phases.build]
cmds = ["npm --prefix frontend run build"]

[start]
cmd = "cd /app/backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
